<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STL to STEP - 3D Printer File Utility</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="stl-to-step">
  <div class="container">
    <header>
      <a href="index.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back
      </a>
      <h1>STL to <span class="accent">STEP</span></h1>
      <p class="subtitle">Convert mesh files to parametric CAD format using OpenCascade</p>
    </header>

    <!-- File Upload -->
    <div class="card">
      <h2>Upload</h2>
      <div class="file-drop-zone" id="dropZone">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
          </svg>
        </div>
        <div class="text">Drop your .stl file here or <strong>click to browse</strong></div>
        <div class="supported-formats">.stl (binary or ASCII)</div>
        <input type="file" id="fileInput" accept=".stl">
      </div>
      <div class="file-info" id="fileInfo">
        <strong id="fileName"></strong><br>
        <span id="fileStats"></span>
      </div>
    </div>

    <!-- Options -->
    <div class="card" id="optionsCard" style="display: none;">
      <h2>Options</h2>

      <div class="toggle-row" style="margin-bottom: var(--space-md);">
        <label class="toggle-label" for="unifyFaces">
          <span>Merge coplanar faces</span>
          <span class="toggle-help">Drastically reduces STEP size for mechanical parts (recommended)</span>
        </label>
        <label class="toggle-switch">
          <input type="checkbox" id="unifyFaces" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="toggle-row">
        <label class="toggle-label" for="makeSolid">
          <span>Try to create solid</span>
          <span class="toggle-help">Closes the shell into a solid body (only works on watertight meshes)</span>
        </label>
        <label class="toggle-switch">
          <input type="checkbox" id="makeSolid" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- Process Button -->
    <div class="card" id="processCard" style="display: none;">
      <button class="btn-process" id="processBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <path d="M14 2v6h6"/>
        </svg>
        Convert to STEP
      </button>
      <div class="progress-container" id="progressContainer">
        <div class="progress-bar">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">Processing...</div>
      </div>
    </div>

    <!-- Log -->
    <div class="card" id="logCard" style="display: none;">
      <h2>Log</h2>
      <div id="conversionLog" class="repair-log"></div>
    </div>

    <!-- Result -->
    <div class="card" id="resultCard" style="display: none;">
      <h2>Result</h2>
      <p id="resultSummary" class="repair-summary"></p>
      <button class="btn-download" id="downloadBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
        </svg>
        Download .step
      </button>
    </div>
  </div>

  <!-- Loader Overlay -->
  <div class="loader-overlay" id="loaderOverlay">
    <div class="loader-content">
      <div class="loader-spinner"></div>
      <div class="loader-text" id="loaderText">Loading...</div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/stlToStep.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initStlToStep);
  </script>
</body>
</html>
