<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewer - 3D Printer File Utility</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="viewer">
  <div class="container">
    <header>
      <a href="index.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back
      </a>
      <h1>3D <span class="accent">Viewer</span></h1>
      <p class="subtitle">Preview and inspect 3D files</p>
    </header>

    <!-- File Upload -->
    <div class="card">
      <h2>Upload</h2>
      <div class="file-drop-zone" id="dropZone">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
          </svg>
        </div>
        <div class="text">Drop your file here or <strong>click to browse</strong></div>
        <div class="supported-formats">OBJ, STL, GLB, 3MF</div>
        <input type="file" id="fileInput">
      </div>
      <div class="file-info" id="fileInfo">
        <strong id="fileName"></strong><br>
        <span id="fileStats"></span>
      </div>
    </div>

    <!-- 3D Viewer -->
    <div class="card" id="viewerCard" style="display: none;">
      <h2>Preview</h2>
      <div class="viewer-wrapper">
        <div id="viewer3DContainer" class="viewer-container"></div>
        <div class="viewer-grid-overlay" id="viewerGridOverlay">
          <div class="grid-minor">
            <div></div><div></div><div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div><div></div><div></div>
          </div>
          <div class="grid-major">
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
          </div>
        </div>
        <div class="render-progress" id="rtProgress" style="display:none">
          <div class="render-progress-bar"><div id="rtProgressFill"></div></div>
          <span id="rtProgressText">0 samples</span>
        </div>
        <div class="viewer-buttons">
          <button class="btn-viewer active" id="toggleAoBtn" title="Toggle Ambient Occlusion">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0 0 20"/>
            </svg>
            AO
          </button>
          <button class="btn-viewer active" id="toggleShadowBtn" title="Toggle Ground Shadow">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <ellipse cx="12" cy="19" rx="9" ry="3"/><circle cx="12" cy="10" r="7"/>
            </svg>
            Shadow
          </button>
          <button class="btn-viewer" id="toggleWireframeBtn" title="Toggle Wireframe">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            Wire
          </button>
          <button class="btn-viewer" id="toggleFdmBtn" title="FDM Print Simulation">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
            </svg>
            FDM
          </button>
          <button class="btn-viewer" id="zoomFitBtn" title="Zoom to fit 2/3 frame">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
            </svg>
            Fit
          </button>
          <button class="btn-viewer" id="toggleGridBtn" title="Toggle 3x3 Grid Overlay">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/>
            </svg>
            Grid
          </button>
          <button class="btn-viewer" id="toggleRaytraceBtn" title="Path-traced preview (slower, photographic)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>
            </svg>
            Ray
          </button>
          <button class="btn-viewer rt-only" id="toggleAlphaBtn" style="display:none" title="Cut the model out on export: transparent backdrop, shadow carried in the alpha">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2a10 10 0 100 20z"/><circle cx="12" cy="12" r="10"/>
            </svg>
            Alpha
          </button>
          <button class="btn-viewer" id="toggleSettingsBtn" title="Viewer Settings">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
            </svg>
          </button>
          <button class="btn-viewer" id="exportPreviewPngBtn" style="display: none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
            </svg>
            PNG
          </button>
          <button class="btn-viewer" id="exportTurntableBtn" style="display: none;" title="Export a 360° turntable as animated WebP">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
            </svg>
            360
          </button>
          <button class="btn-viewer" id="exportPreviewObjBtn" style="display: none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
            </svg>
            OBJ
          </button>
        </div>
        <div class="viewer-settings" id="viewerSettings">
          <div class="viewer-setting-row rt-setting" style="display:none">
            <label>Denoise</label>
            <input type="range" id="denoiseSlider" min="0" max="1" step="0.05" value="0.6">
            <span class="setting-value" id="denoiseValue">0.60</span>
          </div>
          <div class="viewer-setting-row rt-setting" style="display:none">
            <label>Exposure</label>
            <input type="range" id="exposureSlider" min="0.2" max="2" step="0.05" value="1">
            <span class="setting-value" id="exposureValue">1.00</span>
          </div>
          <div class="viewer-setting-row rt-setting" style="display:none">
            <label>Light Angle</label>
            <input type="range" id="lightAzimuthSlider" min="0" max="360" step="5" value="145">
            <span class="setting-value" id="lightAzimuthValue">145°</span>
          </div>
          <div class="viewer-setting-row rt-setting" style="display:none">
            <label>Light Height</label>
            <input type="range" id="lightElevationSlider" min="5" max="89" step="1" value="40">
            <span class="setting-value" id="lightElevationValue">40°</span>
          </div>
          <div class="viewer-setting-row rt-setting" style="display:none">
            <label>Shadow Blur</label>
            <input type="range" id="shadowBlurSlider" min="0" max="1" step="0.05" value="0.35">
            <span class="setting-value" id="shadowBlurValue">0.35</span>
          </div>
          <div class="viewer-setting-row rt-setting" style="display:none">
            <label>Global Light</label>
            <input type="range" id="envIntensitySlider" min="0" max="0.95" step="0.05" value="0.3">
            <span class="setting-value" id="envIntensityValue">0.30</span>
          </div>
          <div class="viewer-setting-row rt-setting" style="display:none">
            <label>Bounces</label>
            <input type="range" id="bouncesSlider" min="1" max="8" step="1" value="3">
            <span class="setting-value" id="bouncesValue">3</span>
          </div>
          <div class="viewer-setting-row raster-setting">
            <label>AO Strength</label>
            <input type="range" id="aoStrengthSlider" min="0" max="2" step="0.05" value="0.7">
            <span class="setting-value" id="aoStrengthValue">0.7</span>
          </div>
          <div class="viewer-setting-row raster-setting">
            <label>Shadow Opacity</label>
            <input type="range" id="shadowOpacitySlider" min="0" max="0.5" step="0.01" value="0.12">
            <span class="setting-value" id="shadowOpacityValue">0.12</span>
          </div>
          <div class="viewer-setting-row raster-setting">
            <label>Shadow Spread</label>
            <input type="range" id="shadowSpreadSlider" min="1" max="200" step="1" value="100">
            <span class="setting-value" id="shadowSpreadValue">100</span>
          </div>
          <div class="viewer-setting-row raster-setting">
            <label>Brightness</label>
            <input type="range" id="brightnessSlider" min="0.5" max="2" step="0.05" value="1">
            <span class="setting-value" id="brightnessValue">1.00</span>
          </div>
          <div class="viewer-setting-row raster-setting">
            <label>Contrast</label>
            <input type="range" id="contrastSlider" min="0.5" max="2" step="0.05" value="1">
            <span class="setting-value" id="contrastValue">1.00</span>
          </div>
          <div class="viewer-setting-row raster-setting">
            <label>Saturation</label>
            <input type="range" id="saturationSlider" min="0" max="2" step="0.05" value="1">
            <span class="setting-value" id="saturationValue">1.00</span>
          </div>
          <div class="viewer-setting-row raster-setting">
            <label>Temperature</label>
            <input type="range" id="temperatureSlider" min="-0.3" max="0.3" step="0.01" value="0">
            <span class="setting-value" id="temperatureValue">0.00</span>
          </div>
          <div class="viewer-setting-divider fdm-setting" style="display:none"></div>
          <div class="viewer-setting-row fdm-setting" style="display:none">
            <label>Layer Height</label>
            <input type="range" id="fdmLayerHeightSlider" min="0.04" max="0.8" step="0.02" value="0.2">
            <span class="setting-value" id="fdmLayerHeightValue">0.20 mm</span>
          </div>
          <div class="viewer-setting-row fdm-setting" style="display:none">
            <label>Layer Lines</label>
            <input type="range" id="fdmLayerStrengthSlider" min="0" max="1" step="0.05" value="0.5">
            <span class="setting-value" id="fdmLayerStrengthValue">0.50</span>
          </div>
          <div class="viewer-setting-row fdm-setting" style="display:none">
            <label>Contamination</label>
            <input type="range" id="fdmContaminationSlider" min="0" max="1" step="0.05" value="0.3">
            <span class="setting-value" id="fdmContaminationValue">0.30</span>
          </div>
          <div class="viewer-setting-divider"></div>
          <div class="viewer-setting-row">
            <label>Turntable Frames</label>
            <input type="range" id="turntableFramesSlider" min="8" max="240" step="1" value="72">
            <span class="setting-value" id="turntableFramesValue">72 f · 2.4s</span>
          </div>
          <div class="viewer-setting-row">
            <label>Turntable FPS</label>
            <input type="range" id="turntableFpsSlider" min="5" max="60" step="1" value="30">
            <span class="setting-value" id="turntableFpsValue">30 fps</span>
          </div>
          <div class="viewer-setting-row">
            <label>Turntable Width</label>
            <input type="range" id="turntableWidthSlider" min="256" max="1920" step="32" value="800">
            <span class="setting-value" id="turntableWidthValue">800 px</span>
          </div>
          <div class="viewer-setting-row">
            <label>Turntable Quality</label>
            <input type="range" id="turntableQualitySlider" min="0.5" max="1" step="0.05" value="0.9">
            <span class="setting-value" id="turntableQualityValue">0.90</span>
          </div>
          <div class="viewer-setting-divider"></div>
          <div class="viewer-setting-row">
            <label>Rotation</label>
            <div class="rotation-buttons">
              <button class="btn-rotate" id="rotateX" title="Rotate X +90°">X</button>
              <button class="btn-rotate" id="rotateY" title="Rotate Y +90°">Y</button>
              <button class="btn-rotate" id="rotateZ" title="Rotate Z +90°">Z</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Loader Overlay -->
  <div class="loader-overlay" id="loaderOverlay">
    <div class="loader-content">
      <div class="loader-spinner"></div>
      <div class="loader-text" id="loaderText">Loading...</div>
    </div>
  </div>

  <!-- Scripts -->
  <!-- Raytraced turntable: how long to sit on each frame -->
  <div class="modal-overlay" id="rtTurntableOverlay">
    <div class="modal">
      <h3>Raytraced turntable</h3>
      <div class="modal-group">
        <label for="rtSamplesInput">Samples per frame</label>
        <input type="text" id="rtSamplesInput" value="32" inputmode="numeric">
      </div>
      <p class="modal-note" id="rtTurntableEstimate">Measuring...</p>
      <div class="modal-buttons">
        <button class="btn-secondary" id="rtTurntableCancel">Cancel</button>
        <button class="btn-primary" id="rtTurntableConfirm">Export</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>
  <script src="js/Color.js"></script>
  <script src="js/state.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/pickedPaletteStorage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/fileHandling.js"></script>
  <script src="js/objParser.js"></script>
  <script src="js/stlParser.js"></script>
  <script src="js/glbParser.js"></script>
  <script src="js/3mfParser.js"></script>
  <script src="js/adjacency.js"></script>
  <script src="js/colorProcessing.js"></script>
  <script src="js/islands.js"></script>
  <script src="js/export.js"></script>
  <script src="js/textureQuantization.js"></script>
  <script src="js/texturePreview.js"></script>
  <script src="js/webpAnimEncoder.js"></script>
  <script src="js/viewer3D.js"></script>

  <!-- Path tracer: its own three 0.180 as a module, next to the r128 global the
       viewer uses. They never touch: the two renderers are fed the same parsed
       model rather than sharing a scene. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/build/index.module.js",
      "three-gpu-pathtracer": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.24/build/index.module.js"
    }
  }
  </script>
  <script type="module" src="js/pathRender.js?v=23"></script>
  <script src="js/alphaCutout.js?v=1"></script>
  <script src="js/viewerRaytrace.js?v=7"></script>
  <script src="js/colorPicker.js"></script>
  <script src="js/pickedPalette.js"></script>
  <script src="js/processing.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
